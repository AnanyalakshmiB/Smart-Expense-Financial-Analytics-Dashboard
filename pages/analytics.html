
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Finora</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="main-content">
    <header class="topbar">
        <div>
            <p class="eyebrow">FINANCIAL REPORTS</p>
            <h1>Analytics</h1>
            <p class="subtitle">Understand your spending patterns.</p>
        </div>
        <a class="view-all" href="../index.html">← Dashboard</a>
    </header>

    <section class="summary-grid">
        <article class="summary-card">
            <span>Total Expenses</span>
            <h2>₹28,750</h2>
            <p class="negative">October 2026</p>
        </article>
        <article class="summary-card">
            <span>Average Daily Spend</span>
            <h2>₹928</h2>
            <p class="subtitle">Illustrative estimate</p>
        </article>
    </section>

    <section class="panel">
        <h3>Spending by Category</h3>
        <p class="subtitle">Example category breakdown</p>

        <div class="budget-item">
            <div class="budget-info">
                <span>Food & Dining</span>
                <strong>₹8,000</strong>
            </div>
            <div class="progress-track">
                <div class="progress purple-fill" style="--progress:80%"></div>
            </div>
        </div>

        <div class="budget-item">
            <div class="budget-info">
                <span>Shopping</span>
                <strong>₹6,000</strong>
            </div>
            <div class="progress-track">
                <div class="progress orange-fill" style="--progress:60%"></div>
            </div>
        </div>

        <div class="budget-item">
            <div class="budget-info">
                <span>Transportation</span>
                <strong>₹3,000</strong>
            </div>
            <div class="progress-track">
                <div class="progress green-fill" style="--progress:30%"></div>
            </div>
        </div>

        <div class="budget-item">
            <div class="budget-info">
                <span>Other Expenses</span>
                <strong>₹4,000</strong>
            </div>
            <div class="progress-track">
                <div class="progress red-fill" style="--progress:40%"></div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
